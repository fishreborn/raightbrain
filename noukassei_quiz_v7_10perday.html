const MS_DAY=86400000;
const PER_DAY=10; // 毎日解禁される問題数

function jstDayIndex(){
  // 2025-05-10を起点（day0）として経過日数を返す
  const base=new Date('2025-05-10T00:00:00+09:00').getTime();
  const nowJst=Date.now()+9*3600000;
  return Math.max(0,Math.floor((nowJst-base)/MS_DAY));
}
function jstNow(){return new Date(Date.now()+9*3600000);}
function jstTodayStr(){const t=jstNow();return`${t.getFullYear()}/${String(t.getMonth()+1).padStart(2,'0')}/${String(t.getDate()).padStart(2,'0')}`;}

  {id:'r22',kanji:"獄",answer:"獄",choices:["獄","狱","牢","監"],hint:"法的制裁として自由を奪う閉鎖空間"},
  {id:'r23',kanji:"藤",answer:"藤",choices:["藤","蔓","葡","蓬"],hint:"春に紫の花を垂らす蔓性植物"},
  {id:'r24',kanji:"霜",answer:"霜",choices:["霜","雪","露","氷"],hint:"零度以下の夜に地表に結晶する水蒸気"},

  {id:'r30',kanji:"曖",answer:"曖",choices:["曖","昧","暗","曇"],hint:"関係性や意味が明確に定義されていない状態"},
];

const QUAD_ROTS=[[45,135,225,315],[90,180,270,0],[60,150,240,330],[120,210,300,30],[75,165,255,345]];

// dayIndex に基づき解禁問題を取得（PER_DAY=10問/日）
function getUnlocked(pool, dayIdx){
  const count=Math.min(pool.length, (dayIdx+1)*PER_DAY);
  return pool.slice(0,count);
}

let mode='hira';
let score=0,total=0,answered=false,currentQ=null;
let history={};

async function loadHistory(){
  try{const r=await window.storage.get('nk-hist-v7');if(r&&r.value)history=JSON.parse(r.value);}catch(e){history={};}
}
async function saveHistory(){
  try{await window.storage.set('nk-hist-v7',JSON.stringify(history));}catch(e){}
}

function isLocked(id){
  const h=history[id];if(!h)return false;
  const now=Date.now();
  const limit=h.correct?30*MS_DAY:3*MS_DAY;
  if(now-h.ts<limit)return{until:new Date(h.ts+limit),correct:h.correct};
  return false;
}

function getAvailable(pool,dayIdx){
  return getUnlocked(pool,dayIdx).filter(d=>!isLocked(d.id));
}

function fmtUntil(d){
  const jst=new Date(d.getTime());
  return`${jst.getMonth()+1}月${jst.getDate()}日 ${String(jst.getHours()).padStart(2,'0')}:00`;
}

function shuffle(a){return a.slice().sort(()=>Math.random()-.5)}

function switchMode(m){
  mode=m;score=0;total=0;answered=false;
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',['hira','kanji','rotate'][i]===m));
  nextQuestion();
}

function nextQuestion(){answered=false;currentQ=null;if(mode==='hira')renderHira();else if(mode==='kanji')renderKanji();else renderRotate();}

function scoreBar(avail,unlocked){
  return`<div class="score-bar">
    <span>スコア</span><strong id="sc">${score} / ${total}</strong>
    <span style="margin-left:auto;font-size:12px">残り <strong>${avail}</strong> / 解禁済 ${unlocked}</span>
  </div>`;
}
function updateScore(){const e=document.getElementById('sc');if(e)e.textContent=`${score} / ${total}`;}

async function record(id,correct){history[id]={ts:Date.now(),correct};await saveHistory();}

function pool4Mode(){return mode==='hira'?ALL_HIRA:mode==='kanji'?ALL_KANJI:ALL_ROTATE;}

function doneHTML(dayIdx){
  const pool=pool4Mode();
  const nextUnlock=Object.keys(history).map(id=>{const l=isLocked(id);return l?l.until:null;}).filter(Boolean).sort((a,b)=>a-b)[0];
  const remaining=pool.length-getUnlocked(pool,dayIdx).length;
  return`<div class="all-done">
    <p>🎉 本日の問題は全て完了！</p>
    ${nextUnlock?`<small>ロック解除予定：${fmtUntil(nextUnlock)}</small>`:''}
    <small>${remaining>0?`明日0時にさらに${Math.min(remaining,PER_DAY)}問追加されます`:'全問題が解禁済みです'}</small>
  </div>`;
}

/* ---- HIRA ---- */
function renderHira(){
  const dayIdx=jstDayIndex();
  const unlocked=getUnlocked(ALL_HIRA,dayIdx);
  const avail=getAvailable(ALL_HIRA,dayIdx);
  if(avail.length===0){document.getElementById('quiz-area').innerHTML=scoreBar(0,unlocked.length)+doneHTML(dayIdx);return;}
  const d=avail[Math.floor(Math.random()*avail.length)];
  currentQ=d;
  const shuffled=shuffle(d.word.split('')).join(' ');
  const isNew=!history[d.id];
  document.getElementById('quiz-area').innerHTML=scoreBar(avail.length,unlocked.length)+`<div class="quiz-card">
    <div class="q-label">ひらがな並べ替えクイズ${isNew?'<span class="new-badge">NEW</span>':''}
      <span style="float:right;font-size:11px;color:var(--color-text-secondary)">${d.id.toUpperCase()}</span>
    </div>
    <div class="q-main" style="font-size:20px;letter-spacing:.12em">${shuffled}</div>
    <div class="hint">💡 ${d.hint}</div>
    <input class="type-input" id="typein" type="text" placeholder="ひらがなで入力..." autocomplete="off" onkeydown="if(event.key==='Enter')submitHira()">
    <button class="submit-btn" onclick="submitHira()">答え合わせ ↵</button>
    <div id="rmsg" class="rmsg"></div>
    <button class="action-btn" id="nb" style="display:none" onclick="nextQuestion()">次の問題へ →</button>
  </div>`;
  document.getElementById('typein').focus();
}

async function submitHira(){
  if(answered||!currentQ)return;
  const inp=document.getElementById('typein');
  const val=inp.value.trim().replace(/\s/g,'');
  if(!val)return;
  answered=true;total++;
  inp.disabled=true;
  const ok=val===currentQ.answer;
  if(ok){score++;inp.classList.add('ok');}else inp.classList.add('ng');
  const msg=document.getElementById('rmsg');
  msg.className=ok?'rmsg ok':'rmsg ng';
  msg.textContent=ok?'🎉 正解！ — 1ヶ月後に再出題':`❌ 不正解。正解は「${currentQ.answer}」— 3日後に再挑戦`;
  await record(currentQ.id,ok);
  document.getElementById('nb').style.display='block';
  updateScore();
}

/* ---- KANJI DECOMP ---- */
function renderKanji(){
  const dayIdx=jstDayIndex();
  const unlocked=getUnlocked(ALL_KANJI,dayIdx);
  const avail=getAvailable(ALL_KANJI,dayIdx);
  if(avail.length===0){document.getElementById('quiz-area').innerHTML=scoreBar(0,unlocked.length)+doneHTML(dayIdx);return;}
  const d=avail[Math.floor(Math.random()*avail.length)];
  currentQ=d;
  const isNew=!history[d.id];
  const W=190,H=150;
  let pts='';
  d.svgParts.forEach(p=>{
    const fs=Math.round(54*(p.scale||1));
    pts+=`<text x="${p.x}" y="${p.y}" font-size="${fs}" text-anchor="middle" dominant-baseline="middle" fill="var(--color-text-primary)" transform="rotate(${p.rotate},${p.x},${p.y})">${p.char}</text>`;
  });
  const svg=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${pts}</svg>`;
  const choices=shuffle(d.choices);
  document.getElementById('quiz-area').innerHTML=scoreBar(avail.length,unlocked.length)+`<div class="quiz-card">
    <div class="q-label">漢字分解クイズ${isNew?'<span class="new-badge">NEW</span>':''}
      <span style="float:right;font-size:11px;color:var(--color-text-secondary)">${d.id.toUpperCase()}</span>
    </div>
    <div class="q-main">${svg}</div>
    <div class="hint">💡 ${d.hint}</div>
    <div class="choices">${choices.map(c=>`<button class="choice" onclick="answerKanji(this,'${c}','${d.answer}')">${c}</button>`).join('')}</div>
    <div id="rmsg" class="rmsg"></div>
    <button class="action-btn" id="nb" style="display:none" onclick="nextQuestion()">次の問題へ →</button>
  </div>`;
}

async function answerKanji(el,chosen,correct){
  if(answered)return;
  answered=true;total++;
  document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(b.textContent.trim()===correct)b.classList.add('correct');});
  const ok=chosen===correct;
  if(ok)score++;
  el.classList.add(ok?'correct':'wrong');
  const msg=document.getElementById('rmsg');
  msg.className=ok?'rmsg ok':'rmsg ng';
  msg.textContent=ok?'🎉 正解！ — 1ヶ月後に再出題':`❌ 不正解。正解は「${correct}」— 3日後に再挑戦`;
  await record(currentQ.id,ok);
  document.getElementById('nb').style.display='block';
  updateScore();
}

/* ---- ROTATE ---- */
function renderRotate(){
  const dayIdx=jstDayIndex();
  const unlocked=getUnlocked(ALL_ROTATE,dayIdx);
  const avail=getAvailable(ALL_ROTATE,dayIdx);
  if(avail.length===0){document.getElementById('quiz-area').innerHTML=scoreBar(0,unlocked.length)+doneHTML(dayIdx);return;}
  const d=avail[Math.floor(Math.random()*avail.length)];
  currentQ=d;
  const isNew=!history[d.id];
  const choices=shuffle(d.choices);
  document.getElementById('quiz-area').innerHTML=scoreBar(avail.length,unlocked.length)+`<div class="quiz-card">
    <div class="q-label">漢字4分割回転クイズ${isNew?'<span class="new-badge">NEW</span>':''}
      <span style="float:right;font-size:11px;color:var(--color-text-secondary)">${d.id.toUpperCase()}</span>
    </div>
    <div class="q-main" style="padding:1rem">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;width:184px;height:184px;margin:0 auto">
        ${[0,1,2,3].map(i=>`<canvas id="qc${i}" width="88" height="88" style="border:0.5px solid var(--color-border-tertiary);border-radius:4px"></canvas>`).join('')}
      </div>
    </div>
    <div class="hint">💡 ${d.hint}</div>
    <div class="choices">${choices.map(c=>`<button class="choice" onclick="answerRotate(this,'${c}','${d.answer}')">${c}</button>`).join('')}</div>
    <div id="rmsg" class="rmsg"></div>
    <button class="action-btn" id="nb" style="display:none" onclick="nextQuestion()">次の問題へ →</button>
  </div>`;
  drawQuad(d.kanji);
}

function drawQuad(kanji){
  const SZ=200;
  const off=document.createElement('canvas');off.width=SZ;off.height=SZ;
  const ctx=off.getContext('2d');
  const dark=window.matchMedia('(prefers-color-scheme:dark)').matches;
  ctx.fillStyle=dark?'#e8e6df':'#1a1916';
  ctx.font=`${Math.round(SZ*.82)}px serif`;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(kanji,SZ/2,SZ/2);
  const rots=QUAD_ROTS[Math.floor(Math.random()*QUAD_ROTS.length)];
  [{sx:0,sy:0},{sx:SZ/2,sy:0},{sx:0,sy:SZ/2},{sx:SZ/2,sy:SZ/2}].forEach((q,i)=>{
    const cv=document.getElementById('qc'+i);if(!cv)return;
    const c=cv.getContext('2d');const W=88;
    c.fillStyle=dark?'#1a1916':'#f5f4ef';c.fillRect(0,0,W,W);
    c.save();c.translate(W/2,W/2);c.rotate(rots[i]*Math.PI/180);
    const sc=(W/(SZ/2))*.92;c.scale(sc,sc);
    c.drawImage(off,q.sx,q.sy,SZ/2,SZ/2,-SZ/4,-SZ/4,SZ/2,SZ/2);
    c.restore();
  });
}

async function answerRotate(el,chosen,correct){
  if(answered)return;
  answered=true;total++;
  document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(b.textContent.trim()===correct)b.classList.add('correct');});
  const ok=chosen===correct;
  if(ok)score++;
  el.classList.add(ok?'correct':'wrong');
  const msg=document.getElementById('rmsg');
  msg.className=ok?'rmsg ok':'rmsg ng';
  msg.textContent=ok?'🎉 正解！ — 1ヶ月後に再出題':`❌ 不正解。正解は「${correct}」— 3日後に再挑戦`;
  await record(currentQ.id,ok);
  document.getElementById('nb').style.display='block';
  updateScore();
}

(async()=>{
  await loadHistory();
  document.getElementById('date-label').textContent=`${jstTodayStr()} — 本日の問題`;
  nextQuestion();
})();
</script>
